[project]
name = "hermes-actra-platform"
version = "0.1.0"
description = "Custom actra platform adapter for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hermes-agent",
  "websockets>=12.0",
]

[project.entry-points."hermes_agent.plugins"]
actra = "actra"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
actra = ["plugin.yaml"]