[project]
name = "hermes-actra-platform"
version = "0.1.1"
description = "Custom actra platform adapter for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Dong Shuaijie" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["hermes-agent", "actra", "websocket", "plugin"]
dependencies = [
  "websockets>=12.0",
]

[project.optional-dependencies]
# The current Hermes runtime is installed by its own installer/PM and
# reports 0.0.0. Requiring it here can replace it with an old PyPI release.
hermes = ["hermes-agent>=0.17.0,<0.24"]

[project.urls]
Homepage = "https://github.com/stavecho/hermes-actra-platform"
Repository = "https://github.com/stavecho/hermes-actra-platform"
Issues = "https://github.com/stavecho/hermes-actra-platform/issues"

[project.entry-points."hermes_agent.plugins"]
actra = "actra"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages = ["actra"]

[tool.setuptools.package-data]
actra = ["plugin.yaml"]
