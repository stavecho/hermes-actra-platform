name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
        hermes: ["0.17.0", "0.19.0"]
        include:
          - python: "3.14"
            hermes: "v0.23.1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build twine uv==0.13.7
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in a separate runtime environment
        env:
          HERMES_TARGET: ${{ matrix.hermes }}
        run: |
          python -m venv "$RUNNER_TEMP/plugin-check"
          if [ "$HERMES_TARGET" = "v0.23.1" ]; then
            curl --fail --location https://github.com/NousResearch/hermes-agent/archive/refs/tags/v0.23.1.tar.gz --output "$RUNNER_TEMP/hermes.tar.gz"
            tar -xzf "$RUNNER_TEMP/hermes.tar.gz" -C "$RUNNER_TEMP"
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/plugin-check" uv sync --project "$RUNNER_TEMP/hermes-agent-0.23.1" --frozen --no-default-groups --no-dev --inexact --python "$(command -v python)"
          else
            "$RUNNER_TEMP/plugin-check/bin/python" -m pip install "hermes-agent==$HERMES_TARGET"
          fi
          "$RUNNER_TEMP/plugin-check/bin/python" -c 'from importlib.metadata import version; from pathlib import Path; import os; Path(os.environ["RUNNER_TEMP"], "hermes-version").write_text(version("hermes-agent"))'
          if [ "$HERMES_TARGET" = "v0.23.1" ]; then
            uv pip install --python "$RUNNER_TEMP/plugin-check/bin/python" dist/*.whl
            "$RUNNER_TEMP/plugin-check/bin/python" scripts/check_dependencies.py "$(command -v uv)" "$RUNNER_TEMP/hermes-agent-0.23.1/uv.lock"
          else
            "$RUNNER_TEMP/plugin-check/bin/python" -m pip install dist/*.whl
            "$RUNNER_TEMP/plugin-check/bin/python" -m pip check
          fi
      - name: Check installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        run: |
          export EXPECTED_HERMES_VERSION="$(cat "$RUNNER_TEMP/hermes-version")"
          "$RUNNER_TEMP/plugin-check/bin/python" "$GITHUB_WORKSPACE/scripts/check_install.py"
