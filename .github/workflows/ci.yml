name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in a separate runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/plugin-check"
          "$RUNNER_TEMP/plugin-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/plugin-check/bin/python" -m pip check
      - name: Check installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/plugin-check/bin/python" "$GITHUB_WORKSPACE/scripts/check_install.py"'
