name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in a separate runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/plugin-check"
          "$RUNNER_TEMP/plugin-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/plugin-check/bin/python" -m pip check
      - name: Check installed wheel outside source directory
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/plugin-check/bin/python" "$GITHUB_WORKSPACE/scripts/check_install.py"'
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-actra-platform
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
